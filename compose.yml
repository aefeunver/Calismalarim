name: pardus-odev

services:
  postgres:
    image: postgres:18.6
    container_name: odev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-odev}
    ports:
      - "${BIND_IP:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18+ uses /var/lib/postgresql, not the 17-era mount path.
      - postgres-data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [odev]

  pgadmin:
    image: ${PGADMIN_IMAGE:-dpage/pgadmin4:9.18}
    container_name: odev-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:?Set PGADMIN_DEFAULT_EMAIL in .env}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?Set PGADMIN_DEFAULT_PASSWORD in .env}
    ports:
      - "${BIND_IP:-127.0.0.1}:${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks: [odev]

  nexus:
    image: ${NEXUS_IMAGE:-sonatype/nexus3:3.77.2-java17-alpine}
    container_name: odev-nexus
    hostname: kizilkoyunlu
    restart: unless-stopped
    environment:
      INSTALL4J_ADD_VM_PARAMS: >-
        -Xms1024m -Xmx1024m -XX:MaxDirectMemorySize=1024m
        -Djava.util.prefs.userRoot=/nexus-data
      NEXUS_DATASTORE_ENABLED: "true"
      NEXUS_DATASTORE_NEXUS_JDBCURL: jdbc:postgresql://postgres:5432/nexus
      NEXUS_DATASTORE_NEXUS_USERNAME: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      NEXUS_DATASTORE_NEXUS_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      NEXUS_DATASTORE_NEXUS_ADVANCED: maximumPoolSize=20
    ports:
      - "${BIND_IP:-127.0.0.1}:${NEXUS_PORT:-8081}:8081"
    volumes:
      - nexus-data:/nexus-data
    depends_on:
      postgres:
        condition: service_healthy
    stop_grace_period: 120s
    networks: [odev]

networks:
  odev:
    driver: bridge

volumes:
  postgres-data:
  pgadmin-data:
  nexus-data:
